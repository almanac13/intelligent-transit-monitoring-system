<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Astana Transit — UX prototype</title>
<style>
*{box-sizing:border-box}main,.panel,.grid>*,.shell>*{min-width:0}body{margin:0;font:15px/1.5 Arial,sans-serif;color:#172a34;background:#f3f6f7}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid #b7c7cd;background:white;color:#173f49;padding:10px 15px;border-radius:7px}button:hover{background:#e8f3f2}button:disabled{cursor:not-allowed;opacity:.5}button.primary{background:#086b67;color:white;border-color:#086b67}button:focus-visible,a:focus-visible{outline:3px solid #e2ac36;outline-offset:3px}a{color:#086b67}header{background:#fff;border-bottom:1px solid #dce5e7;padding:13px 28px;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}.brand{font-weight:bold;font-size:20px}.small{font-size:13px;color:#536b76}.demo{background:#fff2ce;color:#624b13;padding:5px 10px;border-radius:5px;font-size:13px}.shell{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 72px)}aside{background:#143b43;color:white;padding:24px 16px}nav{display:grid;gap:9px;margin-top:22px}nav button{text-align:left;color:#e4f3f4;background:transparent;border:0}nav button.active{background:#28535a;color:white}main{padding:30px;max-width:1450px;width:100%}h1{font-size:29px;margin:0 0 5px}h2{font-size:19px;margin:0 0 14px}h3{font-size:16px;margin:0 0 8px}.intro{color:#526b75;margin:0 0 25px}.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}.between{justify-content:space-between}.panel{background:white;border:1px solid #dce5e7;border-radius:10px;padding:22px;margin-bottom:20px}.grid{display:grid;grid-template-columns:1.3fr 1fr;gap:20px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin:22px 0}.metric{background:white;padding:19px;border-radius:9px;border:1px solid #dce5e7}.metric strong{display:block;font-size:28px}label{display:grid;gap:6px;color:#38545e}input,select,textarea{border:1px solid #aabec6;border-radius:6px;padding:9px;background:white;color:#17323d;max-width:100%}textarea{width:100%;min-height:110px}form{display:grid;gap:18px}.filters{display:flex;gap:12px;flex-wrap:wrap;margin:22px 0}.filters label{flex:1;min-width:145px}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:600px}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid #e4eaed}th{color:#526b75;font-size:13px}.pill{display:inline-block;padding:3px 9px;background:#e6f2ef;color:#235a4e;border-radius:20px;font-size:13px}.warn{background:#fff2ce;color:#73590b}.error{background:#ffeded;color:#8e2e2e;padding:14px;border-radius:7px}.success{background:#e4f2eb;color:#22553d;padding:14px;border-radius:7px}.notice{border-left:3px solid #ce9f28;padding:10px 14px;background:#fff8e7;margin:14px 0}.facts{display:grid;grid-template-columns:1fr 1fr;gap:15px}.facts dt{color:#617883;font-size:13px}.facts dd{margin:3px 0 0;font-weight:bold}.bar{height:17px;background:#e5efed;border-radius:4px;margin:8px 0 14px}.bar span{display:block;height:100%;background:#168b81;border-radius:4px}.api{padding:14px;border:1px dashed #bccbd0;border-radius:7px;font:13px/1.6 monospace;overflow-wrap:anywhere;color:#48616d}footer{color:#526b75;margin-top:20px;font-size:13px}svg{width:100%;height:auto}#notice:empty{display:none}.login{max-width:580px;margin:45px auto}.empty{padding:30px;color:#617883;text-align:center}details{margin-top:20px}summary{cursor:pointer}.flow{display:flex;flex-wrap:wrap;gap:10px;margin:15px 0}.flow span{padding:7px 10px;background:#edf2f3;border-radius:6px}.flow .current{background:#d7eee8;color:#1b5b4c}@media(max-width:900px){.grid{grid-template-columns:1fr}.shell{grid-template-columns:180px 1fr}main{padding:20px}}@media(max-width:650px){.shell{display:block}aside{padding:15px}nav{display:flex;flex-wrap:wrap;margin-top:10px;gap:3px}nav button{padding:8px}.metrics{grid-template-columns:1fr}main{padding:16px}header{padding:12px 16px}.facts{grid-template-columns:1fr}}
</style></head><body>
<header><span class="brand">Astana Transit <span class="small">/ operations workspace</span></span><span class="demo">Interactive prototype · illustrative data</span><div id="account" class="row"></div></header>
<div class="shell"><aside><div class="small" style="color:#b8d1d4">HISTORICAL ANALYSIS</div><nav id="nav" aria-label="Main navigation"></nav><p class="small" style="color:#b8d1d4;margin-top:30px">Selected Astana routes<br>No live feed connected</p><button id="reset" style="margin-top:20px">Reset demo</button></aside><main><div id="notice" role="status" aria-live="polite"></div><div id="screen"></div><footer>Prototype only. No credentials, uploads, reports, or analysis are sent to a server. State clears on reload.</footer></main></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const methods=['Rules','Statistics','Isolation Forest'];
const events=[
{id:'EV-101',route:'10',vehicle:'BUS-014',date:'2026-10-23',time:'08:15',type:'Long running time',method:'Rules',observed:420,reference:240,threshold:360,flag:'No blocking flags',batch:'IMP-001',run:'RUN-001',source:'ROW-048',stop:'Stop A → Stop B'},
{id:'EV-102',route:'10',vehicle:'BUS-021',date:'2026-10-23',time:'08:32',type:'Long dwell time',method:'Statistics',observed:180,reference:45,threshold:120,flag:'GPS-derived duration',batch:'IMP-001',run:'RUN-002',source:'ROW-076',stop:'Stop B'},
{id:'EV-103',route:'20',vehicle:'BUS-032',date:'2026-10-23',time:'09:05',type:'Long running time',method:'Isolation Forest',observed:510,reference:260,threshold:null,flag:'Context sample: 42',batch:'IMP-001',run:'RUN-003',source:'ROW-119',stop:'Stop C → Stop D'},
{id:'EV-104',route:'20',vehicle:'BUS-041',date:'2026-10-24',time:'07:55',type:'Long dwell time',method:'Rules',observed:160,reference:40,threshold:120,flag:'No blocking flags',batch:'IMP-002',run:'RUN-004',source:'ROW-031',stop:'Stop C'},
{id:'EV-105',route:'30',vehicle:'BUS-051',date:'2026-10-24',time:'08:20',type:'Long running time',method:'Statistics',observed:480,reference:250,threshold:400,flag:'Context sample: 36',batch:'IMP-002',run:'RUN-005',source:'ROW-066',stop:'Stop E → Stop F'},
{id:'EV-106',route:'30',vehicle:'BUS-057',date:'2026-10-24',time:'09:10',type:'Long dwell time',method:'Isolation Forest',observed:170,reference:50,threshold:null,flag:'GPS-derived duration',batch:'IMP-002',run:'RUN-006',source:'ROW-087',stop:'Stop F'}];
let role='',view='events',selected='EV-101',jobs=[],reports=[],filter={route:'',method:'',type:'',from:'2026-10-23',to:'2026-10-24'},recommendations={},lastApi='';
const allowed={Dispatcher:['events','imports','analysis','jobs','reports'],Analyst:['events'],'Passenger':['submit']};
function msg(t,error=false){$('#notice').innerHTML=`<p class="${error?'error':'success'}">${esc(t)}</p>`;}
function api(t){lastApi=t;return `<details><summary>Illustrative API interaction</summary><div class="api">${esc(t)}</div></details>`}
function opts(a,val=''){return a.map(v=>`<option ${v===val?'selected':''}>${esc(v)}</option>`).join('')}
function permit(action){if(!allowed[role]?.includes(action)){msg('Access denied for this demo role.',true);return false}return true}
function login(){role='';$('#account').innerHTML='';$('#nav').innerHTML='';$('#screen').innerHTML=`<section class="panel login"><span class="pill">UC01 · Sign in</span><h1 style="margin-top:18px">Choose a demo account</h1><p class="intro">Explore the workflow with the permissions of each user role.</p><form id="login"><label>Pre-created account<select id="demo-role">${opts(['Dispatcher','Analyst','Passenger'])}</select></label><button class="primary">Enter workspace</button></form><p class="small">Demo account selection simulates sign-in. It provides no real authentication.</p>${api('POST /v1/sessions → illustrative role session')}</section>`;$('#login').onsubmit=e=>{e.preventDefault();role=$('#demo-role').value;view=role==='Passenger'?'submit':'events';render()}}
function render(){if(!role)return login();$('#account').innerHTML=`<span>${esc(role)} demo</span><button id="signout">Sign out</button>`;$('#signout').onclick=()=>{$('#notice').innerHTML='';login()};const names={events:'Events & analytics',imports:'Import data',analysis:'Start analysis',jobs:'Background jobs',reports:'Passenger reports',submit:'Submit a report'};$('#nav').innerHTML=allowed[role].map(k=>`<button data-nav="${k}" class="${view===k?'active':''}">${names[k]}</button>`).join('');document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{view=b.dataset.nav;$('#notice').innerHTML='';render()});({events:showEvents,imports:showImports,analysis:showAnalysis,jobs:showJobs,reports:showReports,submit:showSubmit}[view]||showEvents)()}
function filtered(){return events.filter(e=>(!filter.route||e.route===filter.route)&&(!filter.method||e.method===filter.method)&&(!filter.type||e.type===filter.type)&&(!filter.from||e.date>=filter.from)&&(!filter.to||e.date<=filter.to))}
function schematic(e){return `<svg viewBox="0 0 580 170" role="img" aria-label="Schematic stop segment for ${esc(e.id)}; not a geographic map"><rect width="580" height="170" fill="#eef5f3" rx="8"/><path d="M55 100 L180 100 L280 65 L400 65 L525 100" fill="none" stroke="#b5cbc7" stroke-width="6"/><path d="M180 100 L280 65 L400 65" fill="none" stroke="#087a70" stroke-width="7"/>${[55,180,280,400,525].map((x,i)=>`<circle cx="${x}" cy="${[100,100,65,65,100][i]}" r="9" fill="white" stroke="#087a70" stroke-width="3"/>`).join('')}<text x="32" y="140" font-size="15" fill="#35554e">Schematic stops · selected ${esc(e.stop)} · no GPS trace</text></svg>`}
function showEvents(){const es=filtered();if(!es.some(e=>e.id===selected))selected=es[0]?.id;const e=es.find(e=>e.id===selected);$('#screen').innerHTML=`<div class="row between"><div><span class="small">UC04 / UC05 / UC07</span><h1>Events & analytics</h1></div><button id="export" ${es.length?'':'disabled'}>Export ${es.length} events</button></div><p class="intro">Inspect unusual durations and the observations behind them. All values below are illustrative.</p><div class="filters"><label>From<input id="from" type="date" value="${filter.from}"></label><label>To<input id="to" type="date" value="${filter.to}"></label><label>Route<select id="route"><option value="">All routes</option>${opts(['10','20','30'],filter.route)}</select></label><label>Event type<select id="type"><option value="">All types</option>${opts(['Long running time','Long dwell time'],filter.type)}</select></label><label>Method<select id="method"><option value="">All methods</option>${opts(methods,filter.method)}</select></label></div><div class="metrics"><div class="metric"><span>Filtered events</span><strong>${es.length}</strong></div><div class="metric"><span>Long running time</span><strong>${es.filter(e=>e.type==='Long running time').length}</strong></div><div class="metric"><span>Long dwell time</span><strong>${es.filter(e=>e.type==='Long dwell time').length}</strong></div></div><div class="grid"><section class="panel"><h2>Detected events</h2><div class="table-wrap"><table><thead><tr><th>Event / route</th><th>Type / method</th><th>Local time</th><th>Review</th></tr></thead><tbody>${es.map(e=>`<tr><td>${e.id}<br><span class="small">Route ${e.route}</span></td><td>${e.type}<br><span class="small">${e.method}</span></td><td>${e.date}<br>${e.time}</td><td><button data-event="${e.id}" aria-pressed="${selected===e.id}">Inspect</button></td></tr>`).join('')}</tbody></table>${es.length?'':'<p class="empty">No events match these filters. This is not a failed-analysis result.</p>'}</div><h3 style="margin-top:24px">Events by method</h3>${methods.map(m=>{let count=es.filter(e=>e.method===m).length;return `<div class="row between"><span>${m}</span><span>${count}</span></div><div class="bar"><span style="width:${es.length?100*count/es.length:0}%"></span></div>`}).join('')}</section><section class="panel" id="detail">${e?detail(e):'<p class="empty">Select a different date range or filter to inspect an event.</p>'}</section></div>${api('GET /v1/events?route=&from=&to=&type=&method=; GET /v1/events/{id}; GET /v1/events/summary; GET /v1/events/export')}`;
for(const k of ['route','method','type','from','to'])$('#'+k).onchange=ev=>{filter[k]=ev.target.value;if(filter.from&&filter.to&&filter.from>filter.to){msg('From date must not be later than To date.',true);return}$('#notice').innerHTML='';showEvents()};document.querySelectorAll('[data-event]').forEach(b=>b.onclick=()=>{selected=b.dataset.event;showEvents()});$('#export').onclick=()=>download(es);if($('#recommend'))$('#recommend').onclick=()=>{if(!permit('analysis'))return;recommendations[e.id]={origin:$('#provider').value};showEvents();msg('Illustrative recommendation generated. No provider was contacted.')}}
function detail(e){let r=recommendations[e.id];return `<div class="row between"><h2>${e.id} · evidence</h2><span class="pill">Route ${e.route}</span></div>${schematic(e)}<dl class="facts"><div><dt>Vehicle</dt><dd>${e.vehicle}</dd></div><div><dt>Local time (UTC+05:00)</dt><dd>${e.date} ${e.time}</dd></div><div><dt>Observed duration</dt><dd>${e.observed} seconds</dd></div><div><dt>Context reference</dt><dd>${e.reference} seconds</dd></div><div><dt>Method</dt><dd>${e.method}</dd></div><div><dt>Threshold / score</dt><dd>${e.threshold?e.threshold+' s; flag when greater':'Score 0.72; cutoff 0.65'}</dd></div></dl><p class="notice">${e.flag}. Unusual duration does not establish the cause or schedule lateness.</p><details><summary>Source and analysis provenance</summary><p>${e.batch} · ${e.run} · ${e.source}<br>Configuration v1 · seed 42 · illustration dataset<br>Comparison group: route, direction, stop / segment, morning period.</p></details><h3 style="margin-top:22px">Suggested checks</h3>${r?`<p><span class="pill ${r.origin==='fallback'?'warn':''}">${r.origin==='fallback'?'Rule-based fallback':'Simulated language-model output'}</span></p><p>Review ${e.source} and adjacent observations. Confirm stop matching and data coverage before investigating traffic or boarding conditions. The observed ${e.observed} seconds exceeds the ${e.reference}-second context reference; the cause is unverified.</p>`:'<p class="small">No recommendation has been requested for this event.</p>'}${role==='Dispatcher'?`<label>Demo provider state<select id="provider"><option value="fallback">Unavailable — use fallback rules</option><option value="model">Available — simulate response</option></select></label><button class="primary" id="recommend" style="margin-top:12px">Generate suggested checks</button>`:'<p class="small">Analysts can view existing recommendations. Generation requires the dispatcher role.</p>'}`}
function download(es){let cols=['id','route','vehicle','date','time','type','method','observed','reference','run'];let csv=cols.join(',')+'\r\n'+es.map(e=>cols.map(k=>'"'+String(e[k]).replace(/"/g,'""')+'"').join(',')).join('\r\n');let u=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));let a=document.createElement('a');a.href=u;a.download='illustrative-filtered-events.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);msg(`Exported ${es.length} illustrative events matching the active filters.`)}
function showImports(){if(!permit('imports'))return;$('#screen').innerHTML=`<h1>Import historical records</h1><p class="intro">UC02 · Register a batch and inspect validation results.</p><section class="panel"><form id="import"><label>Historical CSV or TSV file<input id="file" type="file" accept=".csv,.tsv,.txt"></label><p class="small">The file name is shown only; contents are not read. You can also run the sample batch without a file.</p><label>Demo scenario<select id="import-case"><option value="success">Sample batch — validation and reconciliation</option><option value="failure">Simulate interrupted import</option><option value="duplicate">Re-import sample batch</option></select></label><button class="primary">Submit import job</button></form></section>${api('POST /v1/imports → {job_id, status:"queued"}; GET /v1/jobs/{id}')}`;$('#import').onsubmit=e=>{e.preventDefault();if(!permit('imports'))return;let name=$('#file').files[0]?.name||'sample-transport.csv';let scenario=$('#import-case').value;if(!/\.(csv|tsv|txt)$/i.test(name))return msg('Choose a CSV or tab-separated file.',true);jobs.push({id:'JOB-'+String(jobs.length+1).padStart(3,'0'),type:'Import',name,scenario,status:'queued'});view='jobs';render();msg('Demo import queued. Advance the job to inspect the outcome.')}}
function showAnalysis(){if(!permit('analysis'))return;$('#screen').innerHTML=`<h1>Configure analysis</h1><p class="intro">UC03 · Compare methods on one illustrative reference dataset.</p><section class="panel"><form id="analysis"><label>Dataset<select><option>Illustration dataset · 6 event examples</option></select></label><label>Methods<select><option>Rules + contextual statistics + Isolation Forest</option></select></label><div class="facts"><label>Minimum context sample<input type="number" min="1" required id="sample" value="20"></label><label>Random seed<input type="number" required id="seed" value="42"></label></div><label>Demo outcome<select id="analysis-case"><option value="success">Complete with illustrative results</option><option value="insufficient">Insufficient reference data</option><option value="failure">Simulate worker failure</option></select></label><p class="notice">No algorithms run here. The method comparison uses the same prewritten fixtures; no precision or recall is claimed.</p><button class="primary">Start analysis job</button></form></section>${api('POST /v1/analysis-runs → {job_id, status:"queued"}; worker batches / progress / results are internal')}`;$('#analysis').onsubmit=e=>{e.preventDefault();if(!permit('analysis'))return;jobs.push({id:'JOB-'+String(jobs.length+1).padStart(3,'0'),type:'Analysis',name:`Sample minimum ${$('#sample').value}; seed ${$('#seed').value}`,scenario:$('#analysis-case').value,status:'queued'});view='jobs';render();msg('Demo analysis queued. Existing event examples remain unchanged.')}}
function showJobs(){if(!permit('jobs'))return;$('#screen').innerHTML=`<h1>Background jobs</h1><p class="intro">Advance a simulated job to see normal and failure states.</p>${jobs.length?jobs.map(j=>`<section class="panel"><div class="row between"><h2>${j.id} · ${j.type}</h2><span class="pill ${['failed','interrupted'].includes(j.status)?'warn':''}">${j.status}</span></div><p>${esc(j.name)}</p><div class="flow">${['queued','running','completed'].map(x=>`<span class="${j.status===x?'current':''}">${x}</span>`).join('')}</div>${j.status==='queued'?`<button class="primary" data-advance="${j.id}">Start demo worker</button>`:j.status==='running'?`<p>Progress: 60 of 100 sample rows</p><button class="primary" data-advance="${j.id}">Show final outcome</button>`:outcome(j)}</section>`).join(''):'<section class="panel empty">No jobs submitted. Import a sample batch or start an analysis.</section>'}${api('GET /v1/jobs/{id} → status, processed_count, result or failure_reason')}`;document.querySelectorAll('[data-advance]').forEach(b=>b.onclick=()=>{let j=jobs.find(x=>x.id===b.dataset.advance);if(j.status==='queued')j.status='running';else j.status=j.scenario==='failure'?(j.type==='Import'?'interrupted':'failed'):'completed';showJobs()})}
function outcome(j){if(['failed','interrupted'].includes(j.status))return '<p class="error">Worker stopped before result persistence. Job is not complete. Existing results remain available.</p>';if(j.type==='Import')return j.scenario==='duplicate'?'<p class="success">100 rows reconciled: 0 accepted, 100 flagged as already imported, 0 rejected. No analytical rows duplicated.</p>':'<p class="success">100 rows reconciled: 92 accepted + 5 flagged + 3 rejected.</p><p>Flags: 3 zero running times; 2 duplicate rows. Rejections: 1 invalid timestamp; 1 negative duration; 1 unresolved trip. Flagged rows remain traceable under the inclusion policy.</p>';return j.scenario==='insufficient'?'<p class="notice">Analysis completed with an explicit insufficient-reference-data status for one comparison group. No event classification was produced for that group.</p>':'<p class="success">Demo analysis completed. Illustrative fixtures represent all three methods; event records were not recalculated.</p><p>Precision, recall and F1: not reported — no verified labels. This is not a real benchmark.</p>'}
function showSubmit(){if(!permit('submit'))return;$('#screen').innerHTML=`<h1>Report a transport issue</h1><p class="intro">UC08 · Help staff investigate a route and time.</p><section class="panel"><form id="report"><label>Route<select id="report-route" required><option value="">Select route</option>${opts(['10','20','30'])}</select></label><label>Event time (local UTC+05:00)<input id="report-time" type="datetime-local" required value="2026-10-24T08:30"></label><label>Description<textarea id="description" required maxlength="1000" placeholder="Describe what you observed."></textarea></label><button class="primary">Submit report</button></form><p class="small">Demo only. Please do not enter personal information. Reloading clears submitted reports.</p></section>${api('POST /v1/passenger-reports → report_id; invalid route or missing fields → validation error')}`;$('#report').onsubmit=e=>{e.preventDefault();if(!permit('submit'))return;let text=$('#description').value.trim();if(!text)return msg('Enter a description of the observation.',true);reports.push({id:'REP-'+(reports.length+1),route:$('#report-route').value,time:$('#report-time').value,text});$('#report').reset();msg('Demo report received. It is visible to the dispatcher in this browser session.')}}
function showReports(){if(!permit('reports'))return;$('#screen').innerHTML=`<h1>Passenger reports</h1><p class="intro">UC09 · Restricted dispatcher view.</p>${reports.length?reports.map(r=>`<section class="panel"><span class="pill">${r.id} · route ${r.route}</span><p class="small">${esc(r.time)} UTC+05:00</p><p>${esc(r.text)}</p></section>`).join(''):'<section class="panel empty">No reports submitted in this demo. Sign in as Passenger to create one, then return as Dispatcher.</section>'}${api('GET /v1/passenger-reports → staff-only list; analyst/passenger access denied')}`}
$('#reset').onclick=()=>{jobs=[];reports=[];recommendations={};filter={route:'',method:'',type:'',from:'2026-10-23',to:'2026-10-24'};selected='EV-101';$('#notice').innerHTML='';login()};login();
</script></body></html>
